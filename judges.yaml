  - id: originality
    name: 原创侦探
    dimension: 原创性
    weight: 15
    persona: 查水表的，口头禅"这真是你自己写的？"
  - id: aesthetic
    name: 美学警察
    dimension: 美学（只评价不计分）
    weight: 0

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/brand/mascot-64.png">
<title>老板后台 · PitchMaster</title>
<style>  :root {
    --bg: #F5F4F1;
    --surface: #FFFFFF;
    --surface-2: #FAF9F6;
    --ink: #1A1A2E;
    --ink-2: #5A5B6E;
    --line: #E6E3DD;
    --blue: #3B6FE0;
    --blue-deep: #2B56B8;
    --pink: #E75A9C;
    --pink-soft: #FBD9E9;
    --green: #3D9B6A;
    --red: #D95050;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(26,26,46,.06), 0 4px 14px rgba(26,26,46,.05);
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:1060px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:24px; margin:0 0 6px; color:var(--ink); }
  h1 span { color:var(--blue); }
  .admin-brand { display:flex; align-items:center; min-height:32px; }
  .admin-brand img { height:30px; width:auto; display:block; }
  .sub { color:var(--ink-2); font-size:13px; margin:0 0 22px; }

  .section { margin-bottom:22px; }
  .section-head {
    color:var(--ink-2);
    font-size:14px;
    letter-spacing:2px;
    margin:0 0 10px 2px;
  }
  .panel {
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow);
  }
  .card {
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .repo { font-family:var(--mono); font-size:13px; word-break:break-all; color:var(--ink); }
  .id { color:var(--ink-2); font-size:11px; font-family:var(--mono); }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; font-family:var(--mono); }
  .badge.unpaid { color:var(--ink-2); background:#F1EFEA; }
  .badge.pending { color:var(--blue); background:rgba(59,111,224,.10); }
  .badge.approved,.badge.running { color:var(--blue); background:rgba(59,111,224,.10); }
  .badge.done { color:var(--green); background:rgba(61,155,106,.12); }
  .badge.failed,.badge.reworked { color:var(--red); background:rgba(217,80,80,.10); }
  .badge.test { color:var(--ink-2); background:#F1EFEA; }
  .badge.verify { color:var(--pink); background:var(--pink-soft); }
  .badge.evaded { color:var(--red); background:rgba(217,80,80,.10); }

  button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; transition:background .15s; }
  button:hover { background:var(--blue-deep); }
  button.ghost { background:transparent; color:var(--ink-2); border:1px solid var(--line); font-weight:500; }
  button.ghost:hover { color:var(--ink); background:var(--surface-2); }
  button.danger { background:var(--red); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input, textarea { background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-family:inherit; }
  input:focus, textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,111,224,.12); }
  textarea { width:100%; min-height:56px; resize:vertical; }
  .hint { color:var(--ink-2); font-size:12px; }
  .empty { color:var(--ink-2); text-align:center; padding:40px; border:1px dashed var(--line); border-radius:12px; background:var(--surface-2); }
  .error { color:var(--red); font-size:13px; margin-top:8px; }
  #token-bar { display:flex; gap:8px; margin-bottom:22px; }
  #token-bar input { flex:1; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .tile { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .tile .k { color:var(--ink-2); font-size:11px; }
  .tile .v { font-size:22px; font-family:var(--mono); margin-top:4px; color:var(--ink); }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .chart-box { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .chart-title { color:var(--ink-2); font-size:11px; margin-bottom:4px; letter-spacing:.5px; }
  svg { width:100%; height:130px; display:block; }

  .order-time { color:var(--ink-2); font-size:11px; font-family:var(--mono); }
  .order-repo { flex:1; min-width:220px; }
  .flag { color:var(--pink); font-size:12px; }

  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button { background:transparent; color:var(--ink-2); border:1px solid var(--line); }
  .tabs button:hover { background:var(--surface-2); }
  .tabs button.active { color:#fff; background:var(--blue); border-color:var(--blue); }

  #drawer { position:fixed; inset:0; background:rgba(26,26,46,.32); display:flex; justify-content:flex-end; z-index:10; }
  #drawer.hidden { display:none; }
  .drawer-panel { width:min(680px,100%); height:100%; overflow-y:auto; background:var(--surface); border-left:1px solid var(--line); padding:22px; box-shadow:-8px 0 30px rgba(26,26,46,.12); }
  .drawer-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .drawer-head h2 { font-size:18px; margin:0; color:var(--ink); }
  .kv { color:var(--ink-2); font-size:12px; line-height:1.9; }
  .transcript { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; line-height:1.7; }
  .transcript .who { color:var(--blue); font-weight:600; }
  .transcript .ans { color:var(--ink); margin-bottom:8px; }
  .transcript .react { color:var(--ink-2); font-size:12px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin:8px 0 16px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--ink-2); font-weight:500; }
  td { color:var(--ink); }
  #verify-reminder { margin:10px 0; color:var(--pink); font-size:12px; }
  @media (max-width:720px) {
    .charts { grid-template-columns:1fr; }
    main { padding:28px 14px 60px; }
    .order-repo { min-width:0; width:100%; }
  }
  @media (max-width:440px) {
    .tiles { grid-template-columns:1fr 1fr; }
    .panel { padding:12px; }
  }
</style>
</head>
<body>
<main>
  <h1 class="admin-brand">
    <img src="/static/brand/logo-text-trim.png" alt="PitchMaster"
         onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
    <span class="admin-fallback" style="display:none">老板<span>后台</span></span>
  </h1>
  <p class="sub">营收 / 订单 / 质检 · 每 3 秒自动刷新</p>

  <div id="token-bar">
    <input id="token" placeholder="ADMIN_TOKEN">
    <button id="save-token" type="button">确定</button>
  </div>

  <section id="revenue-section" class="section hidden">
    <div class="section-head">营收概览</div>
    <div class="panel">
      <div id="tiles-revenue" class="tiles"></div>
      <div class="charts">
        <div class="chart-box">
          <div class="chart-title">近 12 小时成交单数</div>
          <svg id="bar-chart" viewBox="0 0 520 130" preserveAspectRatio="none"></svg>
        </div>
        <div class="chart-box">
          <div class="chart-title">累计营业额（元）</div>
          <svg id="line-chart" viewBox="0 0 520 130" preserveAspectRatio="none"></svg>
        </div>
      </div>
    </div>
  </section>

  <section id="cost-section" class="section hidden">
    <div class="section-head">成本分析</div>
    <div class="panel">
      <div id="tiles-cost" class="tiles"></div>
      <div class="charts">
        <div class="chart-box">
          <div class="chart-title">成本 vs 收入</div>
          <svg id="cost-chart" viewBox="0 0 520 130" preserveAspectRatio="none"></svg>
        </div>
      </div>
    </div>
  </section>

  <section id="orders-section" class="section hidden">
    <div class="section-head">订单管理</div>
    <div class="panel">
      <div id="tabs" class="tabs">
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="unverified">待核验</button>
        <button type="button" data-filter="test">测试单</button>
      </div>
      <div id="orders"></div>
    </div>
  </section>

  <section id="users-section" class="section hidden">
    <div class="section-head">用户与质检</div>
    <div class="panel">
      <div id="tiles-quality" class="tiles"></div>
      <div id="verify-reminder"></div>
      <div class="chart-title" style="margin-top:12px">注册用户（加分材料 #7）</div>
      <div id="users-table"></div>
    </div>
  </section>
</main>

<div id="drawer" class="hidden">
  <div class="drawer-panel">
    <div class="drawer-head">
      <h2>订单详情</h2>
      <button id="close-drawer" class="ghost" type="button" style="margin-left:auto">关闭</button>
    </div>
    <div id="detail"></div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  let token = params.get("token") || "";
  let drawerId = null;
  let filter = "all";

  document.querySelectorAll("#tabs button").forEach((button) => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll("#tabs button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
      load();
    });
  });

  $("#token").value = token;
  $("#save-token").addEventListener("click", () => {
    token = $("#token").value.trim();
    history.replaceState(null, "", `?token=${encodeURIComponent(token)}`);
    load();
  });
  $("#close-drawer").addEventListener("click", () => {
    drawerId = null;
    $("#drawer").classList.add("hidden");
  });

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  async function api(path, options) {
    const sep = path.includes("?") ? "&" : "?";
    const resp = await fetch(`${path}${sep}token=${encodeURIComponent(token)}`, options);
    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      if (resp.status === 404) detail = "Token 错误或后台未启用";
      throw new Error(detail);
    }
    return resp.json();
  }

  const STATUS_LABEL = {
    unpaid: "待付", pending: "待放行", approved: "已放行",
    running: "评审中", done: "已完成", failed: "失败", reworked: "已重审",
  };

  function fmtTime(ts) {
    if (!ts) return "-";
    const d = new Date(ts * 1000);
    return `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  // ---------------- 图表：纯 SVG，无外部依赖
  function barChart(data) {
    const svg = $("#bar-chart");
    const W = 520, H = 130, padL = 24, padB = 20, padT = 8;
    const max = Math.max(1, ...data.map((d) => d.count));
    const bw = (W - padL - 8) / data.length;
    const parts = [`<line x1="${padL}" y1="${H - padB}" x2="${W - 4}" y2="${H - padB}" stroke="#E6E3DD"/>`];
    data.forEach((d, i) => {
      const h = (d.count / max) * (H - padB - padT);
      const x = padL + i * bw + bw * 0.2;
      const y = H - padB - h;
      parts.push(`<rect x="${x}" y="${y}" width="${bw * 0.6}" height="${h}" fill="${d.count ? "#3B6FE0" : "#ECE9E2"}"/>`);
      if (i % 2 === 0) parts.push(`<text x="${x + bw * 0.3}" y="${H - 6}" fill="#9A9BAA" font-size="9" text-anchor="middle">${d.hour}</text>`);
      if (d.count) parts.push(`<text x="${x + bw * 0.3}" y="${Math.max(10, y - 3)}" fill="#1A1A2E" font-size="9" text-anchor="middle">${d.count}</text>`);
    });
    svg.innerHTML = parts.join("");
  }

  function fmtTokens(value) {
    const n = Number(value || 0);
    if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
    if (n >= 1_000) return `${(n / 1_000).toFixed(1)}k`;
    return String(n);
  }

  function costChart(cost, revenue) {
    const svg = $("#cost-chart");
    const known = cost && cost.cost_known;
    if (!known) {
      svg.innerHTML = `<text x="260" y="65" fill="#9A9BAA" font-size="11" text-anchor="middle">待官方价目确认（仅统计 token）</text>`;
      return;
    }
    const W = 520, H = 130, padL = 40, padB = 24, padT = 12;
    const values = [Number(revenue || 0), Number(cost.total_cost || 0)];
    const max = Math.max(1, ...values);
    const barH = (H - padB - padT) * 0.65;
    const barW = 90;
    const parts = [`<line x1="${padL}" y1="${H - padB}" x2="${W - 10}" y2="${H - padB}" stroke="#E6E3DD"/>`];
    ["收入", "模型成本"].forEach((label, index) => {
      const value = values[index];
      const h = (value / max) * barH;
      const x = 140 + index * 180;
      const y = H - padB - h;
      const color = index === 0 ? "#3D9B6A" : "#D95050";
      parts.push(`<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}"/>`);
      parts.push(`<text x="${x + barW / 2}" y="${y - 4}" fill="#1A1A2E" font-size="10" text-anchor="middle">¥${value.toFixed(2)}</text>`);
      parts.push(`<text x="${x + barW / 2}" y="${H - 8}" fill="#9A9BAA" font-size="10" text-anchor="middle">${label}</text>`);
    });
    if (cost.gross_margin !== null && cost.gross_margin !== undefined) {
      parts.push(`<text x="${W - 10}" y="${padT + 4}" fill="#9A9BAA" font-size="10" text-anchor="end">毛利率 ${(cost.gross_margin * 100).toFixed(1)}%</text>`);
    }
    svg.innerHTML = parts.join("");
  }

  function lineChart(data) {
    const svg = $("#line-chart");
    const W = 520, H = 130, padL = 24, padB = 20, padT = 10;
    const values = data.map((d) => d.value);
    const max = Math.max(1, ...values);
    const step = (W - padL - 8) / Math.max(1, data.length - 1);
    const points = data.map((d, i) => {
      const x = padL + i * step;
      const y = H - padB - (d.value / max) * (H - padB - padT);
      return `${x},${y}`;
    });
    const parts = [
      `<line x1="${padL}" y1="${H - padB}" x2="${W - 4}" y2="${H - padB}" stroke="#E6E3DD"/>`,
      `<polyline points="${points.join(" ")}" fill="none" stroke="#E75A9C" stroke-width="2"/>`,
    ];
    data.forEach((d, i) => {
      if (i % 2 === 0) parts.push(`<text x="${padL + i * step}" y="${H - 6}" fill="#9A9BAA" font-size="9" text-anchor="middle">${d.hour}</text>`);
    });
    parts.push(`<text x="${padL}" y="${padT}" fill="#9A9BAA" font-size="9">峰值 ${max.toFixed(0)} 元</text>`);
    svg.innerHTML = parts.join("");
  }

  function renderTiles(target, items) {
    target.replaceChildren(...items.map(([k, v]) => {
      const tile = el("div", "tile");
      tile.append(el("div", "k", k), el("div", "v", v));
      return tile;
    }));
  }

  function renderStats(stats) {
    const cost = stats.cost || {};
    const margin = cost.gross_margin !== null && cost.gross_margin !== undefined
      ? `${(Number(cost.gross_margin) * 100).toFixed(1)}%`
      : "待价目";

    renderTiles($("#tiles-revenue"), [
      ["今日成交", `${stats.today_count} 单`],
      ["今日营业额", `¥${stats.today_revenue}`],
      ["累计成交", `${stats.total_count} 单`],
      ["累计营业额", `¥${stats.total_revenue}`],
      ["毛利率", margin],
    ]);
    renderTiles($("#tiles-cost"), [
      ["今日 token", fmtTokens(cost.today_tokens)],
      ["本月 token", fmtTokens(cost.month_tokens)],
      ["累计 token", fmtTokens(cost.total_tokens)],
      ["单均 token", fmtTokens(cost.avg_tokens_per_order)],
    ]);
    renderTiles($("#tiles-quality"), [
      ["注册用户", `${stats.user_count ?? 0} 人`],
      ["建议抽检", `${stats.suggested_count} 单`],
      ["待核验", `${stats.unverified_count ?? 0} 单`],
      ["逃单", `${stats.evaded_count ?? 0} 单`],
      ["测试单", `${stats.test_count ?? 0} 单`],
    ]);

    barChart(stats.hourly || []);
    lineChart(stats.cumulative || []);
    costChart(cost, stats.total_revenue || 0);

    const reminder = $("#verify-reminder");
    if ((stats.unverified_count || 0) > 0) {
      reminder.textContent = `⚑ 有 ${stats.unverified_count} 单待核验，请在「订单管理」里标记已核验或逃单。`;
    } else {
      reminder.textContent = "";
    }
  }

  function renderUsers(users) {
    const box = $("#users-table");
    if (!users.length) {
      box.replaceChildren(el("div", "hint", "暂无注册用户"));
      return;
    }
    const table = el("table");
    const head = el("tr");
    ["称呼", "联系方式", "评审次数", "订单数", "成交"].forEach((text) => head.append(el("th", "", text)));
    table.append(head);
    users.forEach((user) => {
      const row = el("tr");
      row.append(
        el("td", "", user.name),
        el("td", "", user.contact || "-"),
        el("td", "", String(user.session_count)),
        el("td", "", String(user.order_count)),
        el("td", "", user.paid ? "已成交" : "未成交")
      );
      table.append(row);
    });
    box.replaceChildren(table);
  }

  // ---------------- 订单列表
  function renderOrders(list) {
    const box = $("#orders");
    const visible = list.filter((order) => {
      if (filter === "unverified") {
        return order.auto_approved && order.verify_status === "unverified";
      }
      if (filter === "test") return order.is_test;
      return true;
    });
    if (!visible.length) {
      box.replaceChildren(el("div", "empty", "暂无订单"));
      return;
    }
    box.replaceChildren(...visible.map((order) => {
      const card = el("div", "card");
      const row = el("div", "row");
      row.append(
        el("span", "order-time", fmtTime(order.created_at)),
        el("span", "repo order-repo", order.repo_url),
        el("span", "id", order.order_id),
        el("span", `badge ${order.status}`, STATUS_LABEL[order.status] || order.status),
        el("span", "hint", `¥${order.price}`)
      );
      if (order.is_test) row.append(el("span", "badge test", "测试"));
      if (order.auto_approved && order.verify_status === "unverified") {
        row.append(el("span", "badge verify", "待核验"));
      }
      if (order.verify_status === "evaded") {
        row.append(el("span", "badge evaded", "逃单"));
      }
      if (order.qa_suggested) row.append(el("span", "flag", "⚑ 建议抽检"));
      if (order.qa_mark === "rework") row.append(el("span", "flag", "已打回"));

      const approveBtn = el("button", "", "放行");
      approveBtn.disabled = order.status !== "pending";
      approveBtn.addEventListener("click", () => approve(order.order_id));
      row.append(approveBtn);

      if (order.auto_approved && order.verify_status === "unverified") {
        const verifyBtn = el("button", "", "已核验");
        verifyBtn.addEventListener("click", () => verifyOrder(order.order_id));
        const evadeBtn = el("button", "danger", "逃单");
        evadeBtn.addEventListener("click", () => evadeOrder(order.order_id));
        row.append(verifyBtn, evadeBtn);
      }

      const testBtn = el("button", "ghost", order.is_test ? "取消测试" : "标为测试");
      testBtn.addEventListener("click", () => markTest(order.order_id, !order.is_test));
      row.append(testBtn);

      const detailBtn = el("button", "ghost", "详情");
      detailBtn.addEventListener("click", () => openDetail(order.order_id));
      row.append(detailBtn);

      card.append(row);
      if (order.owner_comment) {
        card.append(el("div", "hint", `老板亲签：${order.owner_comment}`));
      }
      return card;
    }));
  }

  async function approve(id) {
    try {
      await api(`/api/admin/approve/${id}`, { method: "POST" });
      await load();
    } catch (err) { alert(err.message); }
  }

  async function verifyOrder(id) {
    try {
      await api(`/api/admin/verify/${id}`, { method: "POST" });
      await load();
    } catch (err) { alert(err.message); }
  }

  async function evadeOrder(id) {
    if (!confirm("标记为逃单？")) return;
    try {
      await api(`/api/admin/evade/${id}`, { method: "POST" });
      await load();
    } catch (err) { alert(err.message); }
  }

  async function markTest(id, isTest) {
    try {
      await api(`/api/admin/test/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_test: isTest }),
      });
      await load();
    } catch (err) { alert(err.message); }
  }

  // ---------------- 详情 + 质检
  function renderTranscript(transcript) {
    const box = el("div", "transcript");
    if (!transcript || !transcript.length) {
      box.textContent = "（无问答记录）";
      return box;
    }
    for (const item of transcript) {
      if (item.role === "user_intro") {
        box.append(el("div", "who", "自我介绍"), el("div", "ans", item.text || ""));
      } else if (item.role === "judge_q") {
        box.append(el("div", "who", `Q${item.index || ""} · ${item.judge_name || ""}`), el("div", "ans", item.text || ""));
      } else if (item.role === "user_a") {
        box.append(el("div", "who", "回答"), el("div", "ans", item.text || ""));
      } else if (item.role === "judge_reaction") {
        box.append(el("div", "react", `↳ ${item.judge_name || "评委"}：${item.text || ""}`));
      }
    }
    return box;
  }

  function renderVerdictTable(initial, final) {
    const table = el("table");
    const head = el("tr");
    ["评委", "初评", "终评", "转身", "终评理由"].forEach((text) => head.append(el("th", "", text)));
    table.append(head);
    const initialMap = {};
    (initial || []).forEach((item) => { initialMap[item.judge_id] = item; });
    (final || []).forEach((item) => {
      const row = el("tr");
      const init = initialMap[item.judge_id] || {};
      row.append(
        el("td", "", `${item.name || ""} / ${item.dimension || ""}`),
        el("td", "", `${init.score ?? "-"} / ${item.weight ?? ""}`),
        el("td", "", `${item.final_score ?? "-"} / ${item.weight ?? ""}`),
        el("td", "", item.degraded ? "缺席" : (item.final_verdict === "turn" ? "转身" : "留座")),
        el("td", "", item.reason || "")
      );
      table.append(row);
    });
    return table;
  }

  async function openDetail(id) {
    drawerId = id;
    $("#drawer").classList.remove("hidden");
    $("#detail").replaceChildren(el("div", "hint", "加载中…"));
    try {
      const data = await api(`/api/admin/orders/${id}`);
      renderDetail(data);
    } catch (err) {
      $("#detail").replaceChildren(el("div", "error", err.message));
    }
  }

  function renderDetail(data) {
    const { order, session } = data;
    const box = $("#detail");
    box.replaceChildren();

    box.append(el("div", "kv", `订单 ${order.order_id} · 状态 ${STATUS_LABEL[order.status] || order.status} · ¥${order.price}`));
    box.append(el("div", "kv", `仓库 ${order.repo_url}`));
    if (data.usage) {
      const costText = data.usage.cost_known
        ? ` / ¥${Number(data.usage.cost).toFixed(4)}`
        : " / 成本待官方价目确认";
      box.append(el("div", "hint", `本单消耗 ${data.usage.tokens} tokens（${data.usage.calls} 次调用${costText}）`));
    }
    if (order.qa_suggested && order.qa_suggest_reasons?.length) {
      box.append(el("div", "flag", `⚑ 建议抽检：${order.qa_suggest_reasons.join("；")}`));
    }
    if (order.rework_of) {
      box.append(el("div", "hint", `重审自 ${order.rework_of}｜原因：${order.rework_reason || "-"}`));
    }
    if (order.is_test) {
      box.append(el("div", "flag", "测试单：不计入营业额与质检建议"));
    }
    if (order.auto_approved) {
      const verifyLabel = order.verify_status === "verified" ? "已核验"
        : order.verify_status === "evaded" ? "逃单" : "待核验";
      box.append(el("div", "hint", `自动放行 · 核验状态：${verifyLabel}`));
    }

    // 老板评语
    box.append(el("div", "chart-title", "老板亲签评语"));
    const comment = el("textarea");
    comment.value = order.owner_comment || "";
    const saveComment = el("button", "", "保存评语");
    saveComment.addEventListener("click", async () => {
      try {
        await api(`/api/admin/comment/${order.order_id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: comment.value }),
        });
        saveComment.textContent = "已保存";
        setTimeout(() => { saveComment.textContent = "保存评语"; }, 1200);
      } catch (err) { alert(err.message); }
    });
    box.append(comment, el("div", "row"), saveComment);

    // 质检
    box.append(el("div", "chart-title", "质检"));
    const qaRow = el("div", "row");
    const passBtn = el("button", "", "质检通过");
    passBtn.addEventListener("click", () => markQa(order.order_id, "pass", ""));
    const reworkBtn = el("button", "danger", "打回");
    reworkBtn.addEventListener("click", () => {
      const reason = prompt("打回原因（必填）");
      if (reason && reason.trim()) markQa(order.order_id, "rework", reason.trim());
    });
    qaRow.append(passBtn, reworkBtn);
    if (order.qa_mark === "rework" && order.status !== "reworked") {
      const freeBtn = el("button", "", "免费重审");
      freeBtn.addEventListener("click", () => rework(order.order_id));
      qaRow.append(freeBtn);
    }
    if (order.auto_approved && order.verify_status === "unverified") {
      const verifyBtn = el("button", "", "已核验");
      verifyBtn.addEventListener("click", () => verifyOrder(order.order_id));
      const evadeBtn = el("button", "danger", "逃单");
      evadeBtn.addEventListener("click", () => evadeOrder(order.order_id));
      qaRow.append(verifyBtn, evadeBtn);
    }
    if (order.qa_mark !== "none") {
      qaRow.append(el("span", "hint", `当前：${order.qa_mark === "pass" ? "通过" : "已打回"}`));
    }
    if (order.refunded) {
      qaRow.append(el("span", "hint", "已标记退款（线下原路退）"));
    } else {
      const refundBtn = el("button", "ghost", "标记退款");
      refundBtn.addEventListener("click", () => refund(order.order_id));
      qaRow.append(refundBtn);
    }
    box.append(qaRow);

    // 报告
    if (session?.report_ready) {
      const link = el("a", "hint", "下载报告");
      link.href = `/api/sessions/${order.order_id}/report`;
      link.target = "_blank";
      link.style.display = "inline-block";
      link.style.margin = "10px 0";
      box.append(link);
    }

    // 评审明细
    box.append(el("div", "chart-title", "各评委初评 / 终评"));
    box.append(renderVerdictTable(session?.verdict_initial, session?.verdict_final));

    box.append(el("div", "chart-title", "答辩实录"));
    box.append(renderTranscript(session?.transcript));
  }

  async function markQa(id, mark, reason) {
    try {
      await api(`/api/admin/qa/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mark, reason }),
      });
      await load();
      await openDetail(id);
    } catch (err) { alert(err.message); }
  }

  async function refund(id) {
    if (!confirm("确认标记为已退款？仅记录状态，退款需线下原路操作。")) return;
    try {
      await api(`/api/admin/refund/${id}`, { method: "POST" });
      await load();
      await openDetail(id);
    } catch (err) { alert(err.message); }
  }

  async function rework(id) {
    try {
      const data = await api(`/api/admin/rework/${id}`, { method: "POST" });
      alert(`已创建免费重审单：${data.session_id}`);
      await load();
      await openDetail(id);
    } catch (err) { alert(err.message); }
  }

  // ---------------- 轮询
  const SECTIONS = ["#revenue-section", "#cost-section", "#orders-section", "#users-section"];

  async function load() {
    const box = $("#orders");
    if (!token) {
      SECTIONS.forEach((sel) => $(sel).classList.add("hidden"));
      box.replaceChildren(el("div", "empty", "请先填写 ADMIN_TOKEN"));
      return;
    }
    try {
      const [stats, ordersData, usersData] = await Promise.all([
        api("/api/admin/stats"),
        api("/api/admin/orders"),
        api("/api/admin/users"),
      ]);
      SECTIONS.forEach((sel) => $(sel).classList.remove("hidden"));
      renderStats(stats);
      renderUsers(usersData.users || []);
      renderOrders(ordersData.orders || []);
      if (drawerId) {
        try { const detail = await api(`/api/admin/orders/${drawerId}`); renderDetail(detail); } catch (e) { /* ignore */ }
      }
    } catch (err) {
      SECTIONS.forEach((sel) => $(sel).classList.add("hidden"));
      box.replaceChildren(el("div", "empty error", err.message));
    }
  }

  load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>

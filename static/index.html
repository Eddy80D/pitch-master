<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>路演大师 · PitchMaster</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #14141a;
    --line: #282832;
    --text: #ececf1;
    --muted: #8b8b99;
    --gold: #d9b45b;
    --green: #58c08a;
    --red: #e06a6a;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #1b1a14 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  main { max-width: 960px; margin: 0 auto; padding: 56px 24px 80px; }
  header { margin-bottom: 36px; }
  .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { font-size: 34px; margin: 10px 0 8px; letter-spacing: 1px; }
  h1 span { color: var(--gold); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0; }

  form, .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  form { display: grid; gap: 12px; }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
    resize: vertical;
  }
  textarea { min-height: 84px; line-height: 1.6; }
  input:focus, textarea:focus { border-color: var(--gold); }
  input::placeholder, textarea::placeholder { color: #55555f; }
  button {
    background: var(--gold);
    color: #17140b;
    border: 0;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-weight: 500;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  #form-submit { justify-self: start; margin-top: 4px; }

  #status { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulse 1.4s infinite; }
  .dot.done { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .dot.fail { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  #summary { margin-left: auto; color: var(--gold); font-size: 13px; font-family: var(--mono); }

  #interaction { display: grid; gap: 14px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .card .q-label { color: var(--gold); font-size: 12px; letter-spacing: 1px; margin-bottom: 6px; }
  .card .q-text { color: var(--text); font-size: 16px; line-height: 1.6; margin: 0 0 12px; }
  .report-link {
    display: inline-block;
    color: #17140b;
    background: var(--gold);
    text-decoration: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-weight: 700;
    font-size: 14px;
  }

  #pay-box { text-align: center; margin-top: 16px; }
  #pay-box img { width: 220px; max-width: 70vw; border-radius: 10px; background: #fff; padding: 6px; }
  #pay-box .pay-title { color: var(--gold); font-size: 15px; margin: 0 0 12px; }

  #judges { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .judge {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .judge.turn { border-color: rgba(88, 192, 138, .45); }
  .judge.hold { border-color: rgba(224, 106, 106, .35); }
  .judge.degraded { opacity: .6; }
  .judge-head { display: flex; align-items: baseline; gap: 8px; }
  .judge-name { font-weight: 700; font-size: 15px; }
  .judge-verdict { margin-left: auto; font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; }
  .turn .judge-verdict { color: var(--green); background: rgba(88,192,138,.12); }
  .hold .judge-verdict { color: var(--red); background: rgba(224,106,106,.12); }
  .judge-status { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .judge.ready .judge-status { color: var(--green); }
  .judge-final { display: none; }
  .judge.revealed .judge-status { display: none; }
  .judge.revealed .judge-final { display: block; }
  .judge-final-score { font-family: var(--mono); font-size: 28px; margin: 8px 0 4px; }
  .judge-final-score small { color: var(--muted); font-size: 13px; }
  .judge-final-reason { color: #c9c9d2; font-size: 13px; line-height: 1.65; margin: 0; }

  #log {
    margin-top: 28px;
    background: #0d0d10;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.9;
    color: var(--muted);
    max-height: 360px;
    overflow-y: auto;
  }
  #log .t { color: #55555f; margin-right: 10px; }
  #log .gold { color: var(--gold); }
  #log .green { color: var(--green); }
  #log .red { color: var(--red); }
  #log .hot { color: #ff9d5c; }

  #report-summary { font-size: 15px; line-height: 2; margin: 14px 0 18px; }
  #report-summary b { color: var(--gold); font-family: var(--mono); }
  .owner {
    border-left: 3px solid var(--gold);
    background: rgba(217, 180, 91, .07);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .owner .owner-label { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
  .badge {
    margin-top: 22px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    main { padding-top: 36px; }
    h1 { font-size: 27px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">JUNCTION CHINA 2026 · MiMo Track</div>
    <h1>路演<span>大师</span> PitchMaster</h1>
    <p class="sub">投一个仓库，让五位 AI 评委先替你挑刺。<br>初评 → 自我介绍 → 答辩 → 复议 → 亮椅 → 报告。</p>
  </header>

  <!-- 一级：提交页 -->
  <section id="screen-submit">
    <form id="form">
      <div>
        <label for="repo">GitHub 仓库（必填）</label>
        <input id="repo" name="repo" placeholder="https://github.com/owner/repo" autocomplete="off" required>
      </div>
      <div class="row">
        <div>
          <label for="prd">PRD 链接或摘要（选填，缺省会限制商业化评分）</label>
          <input id="prd" name="prd" placeholder="https://... 或一两句话" autocomplete="off">
        </div>
        <div>
          <label for="demo">成品网址（选填，缺省会限制完成度评分）</label>
          <input id="demo" name="demo" placeholder="https://..." autocomplete="off">
        </div>
      </div>
      <button id="form-submit" type="submit">开始评审</button>
      <div class="hint">仓库以浅克隆方式读取，只读不写。演示模式默认 4 问、每问 45 秒。</div>
    </form>

    <div id="pay-box" class="card hidden">
      <p class="pay-title">扫码支付后开始评审</p>
      <img id="pay-qr" src="/static/pay_qr.png" alt="收款码">
      <div class="actions" style="justify-content:center">
        <button id="paid-btn" type="button">我已支付</button>
      </div>
      <p id="pay-hint" class="hint"></p>
    </div>
  </section>

  <!-- 二级：舞台页 -->
  <section id="screen-stage" class="hidden">
    <div id="status">
      <span id="dot" class="dot live"></span>
      <span id="phase">准备中</span>
      <span id="summary"></span>
    </div>

    <section id="interaction">
      <div id="intro-box" class="card hidden">
        <h2>先介绍一下你的项目</h2>
        <p>30 秒：做什么、给谁、现在做到什么程度。不写也能过，但评委只能按代码判断。</p>
        <textarea id="intro-text" maxlength="500" placeholder="例：我们做了一个面向大学生的 AI 简历优化工具，已上线 3 个模板，日均 200 次调用……"></textarea>
        <div class="actions">
          <button id="intro-submit" type="button">提交介绍</button>
          <button id="intro-skip" class="ghost" type="button">直接宣判</button>
          <span id="intro-hint" class="hint"></span>
        </div>
      </div>

      <div id="answer-box" class="card hidden">
        <div class="q-label">评委追问 <span id="q-index"></span></div>
        <p id="q-text" class="q-text"></p>
        <textarea id="answer-text" maxlength="2000" placeholder="直接回答，别背稿；说不清就承认，评委更看重边界感……"></textarea>
        <div class="actions">
          <button id="answer-submit" type="button">提交回答</button>
          <button id="answer-skip" class="ghost" type="button">直接宣判</button>
          <span id="answer-hint" class="hint"></span>
        </div>
      </div>
    </section>

    <section id="judges"></section>
    <section id="log"></section>
  </section>

  <!-- 三级：报告页 -->
  <section id="screen-report" class="hidden">
    <div class="card">
      <h2>预评审报告</h2>
      <div id="owner-comment" class="owner hidden">
        <div class="owner-label">老板亲签</div>
        <div id="owner-comment-text"></div>
      </div>
      <div id="report-summary">报告生成中…</div>
      <a id="report-link" class="report-link" href="#" download>下载 Markdown 报告</a>
      <div class="badge">🏅 徽章位（待设计）</div>
      <div class="actions">
        <button id="restart" class="ghost" type="button">再来一单</button>
      </div>
    </div>
    <section id="log-report"></section>
  </section>
</main>

<script>
(() => {
  const PHASE_LABEL = {
    created: "已创建",
    loading: "读取仓库",
    analyzing: "解剖代码",
    judging: "评委初评",
    intro: "自我介绍",
    qa: "答辩中",
    deliberation: "评委合议",
    reveal: "亮椅",
    report: "生成报告",
    done: "评审完成",
  };

  const $ = (sel) => document.querySelector(sel);
  const form = $("#form");
  const startBtn = $("#form-submit");
  const repoInput = $("#repo");
  const dot = $("#dot");
  const phaseEl = $("#phase");
  const summaryEl = $("#summary");
  const judgesEl = $("#judges");
  const logEl = $("#log");
  const introBox = $("#intro-box");
  const answerBox = $("#answer-box");
  const payBox = $("#pay-box");

  let source = null;
  let sessionId = null;
  let lastEventId = -1;
  let finished = false;
  let paymentRequired = false;
  const cards = new Map();

  const now = () => new Date().toTimeString().slice(0, 8);

  function log(text, cls = "") {
    const line = document.createElement("div");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = now();
    const body = document.createElement("span");
    body.className = cls;
    body.textContent = text;
    line.append(t, body);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function show(node) { node.classList.remove("hidden"); }
  function hide(node) { node.classList.add("hidden"); }

  function showScreen(name) {
    hide($("#screen-submit"));
    hide($("#screen-stage"));
    hide($("#screen-report"));
    show($(`#screen-${name}`));
  }

  function setPhase(phase) {
    phaseEl.textContent = PHASE_LABEL[phase] || phase;
    if (finished) return;
    dot.classList.toggle("live", phase !== "done");
  }

  function screenForPhase(phase) {
    if (["created"].includes(phase)) return "submit";
    if (["report", "done"].includes(phase)) return "report";
    return "stage";
  }

  function resetInputs() {
    $("#intro-submit").disabled = false;
    $("#intro-skip").disabled = false;
    $("#intro-hint").textContent = "";
    $("#answer-submit").disabled = false;
    $("#answer-skip").disabled = false;
    $("#answer-hint").textContent = "";
  }

  async function post(path, body) {
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    let data = {};
    try { data = await resp.json(); } catch (err) { /* ignore */ }
    if (!resp.ok) throw new Error(data.detail || `请求失败（${resp.status}）`);
    return data;
  }

  // ---------------- 评委卡片：judging 阶段只有"审阅中/已就位"，不显示分数
  function ensureCard(judgeId, name) {
    let card = cards.get(judgeId);
    if (!card) {
      card = el("article", "judge");
      card.dataset.id = judgeId;
      const head = el("div", "judge-head");
      head.append(
        el("span", "judge-name", name || judgeId),
        el("span", "judge-verdict", "")
      );
      card.append(
        head,
        el("div", "judge-status", "审阅中…"),
        el("div", "judge-final")
      );
      cards.set(judgeId, card);
      judgesEl.appendChild(card);
    }
    if (name) {
      card.querySelector(".judge-name").textContent = name;
    }
    return card;
  }

  function markReady(judgeId, name) {
    const card = ensureCard(judgeId, name);
    card.classList.add("ready");
    card.querySelector(".judge-status").textContent = "已就位 ✓";
  }

  function renderReveal(p) {
    const card = ensureCard(p.judge_id, p.name);
    card.classList.add("revealed");
    card.classList.remove("turn", "hold", "degraded");

    const chip = card.querySelector(".judge-verdict");
    if (p.turned === null) {
      card.classList.add("degraded", "hold");
      chip.textContent = "缺席";
      card.querySelector(".judge-final").replaceChildren(
        el("p", "judge-final-reason", "复议失败，缺评（不编造分数）")
      );
      return;
    }

    card.classList.add(p.turned ? "turn" : "hold");
    chip.textContent = p.turned ? "转身 TURN" : "留座 HOLD";

    const score = el("div", "judge-final-score");
    score.append(document.createTextNode(String(p.final_score ?? 0)));
    if (p.weight > 0) score.append(el("small", "", " / " + p.weight));

    const final = card.querySelector(".judge-final");
    final.replaceChildren(
      score,
      el("p", "judge-final-reason", p.reason || "（无评语）")
    );
  }

  function renderReport(data) {
    const totals = data.totals || {};
    const delta = Number(totals.delta ?? 0);
    const sign = delta >= 0 ? "+" : "";
    const summary = $("#report-summary");
    if (totals.valid_weight === undefined) {
      summary.textContent = "报告已生成，可下载查看。";
    } else {
      summary.replaceChildren(
        document.createTextNode("初评 "),
        el("b", "", String(totals.initial ?? 0)),
        document.createTextNode(" → 终评 "),
        el("b", "", String(totals.final ?? 0)),
        document.createTextNode(`（临场力 ${sign}${delta}，有效权重 ${totals.valid_weight}）`)
      );
      if (totals.missing && totals.missing.length) {
        summary.append(el("div", "hint", `缺评维度：${totals.missing.join("、")}`));
      }
    }

    if (data.owner_comment) {
      $("#owner-comment-text").textContent = data.owner_comment;
      show($("#owner-comment"));
    }
    $("#report-link").href = `/api/sessions/${sessionId}/report`;
    showScreen("report");
  }

  function finish(failed) {
    if (finished) return;
    finished = true;
    if (source) {
      source.close();
      source = null;
    }
    startBtn.disabled = false;
    hide(introBox);
    hide(answerBox);
    dot.classList.remove("live");
    dot.classList.add(failed ? "fail" : "done");
    if (!failed) phaseEl.textContent = PHASE_LABEL.done;
  }

  function handle(ev) {
    const { type, payload = {} } = ev;
    switch (type) {
      case "session.created":
        log(`会话 ${payload.session_id} 已创建`, "gold");
        break;
      case "payment.waiting":
        showScreen("submit");
        show(payBox);
        $("#pay-hint").textContent = "扫码支付后点「我已支付」，老板放行后自动开跑。";
        break;
      case "payment.pending":
        show(payBox);
        $("#pay-hint").textContent = "已通知老板，等待放行…";
        $("#paid-btn").disabled = true;
        break;
      case "payment.approved":
        hide(payBox);
        log("老板已放行，评审开始", "gold");
        break;
      case "phase.changed":
        setPhase(payload.phase);
        log(`阶段 → ${PHASE_LABEL[payload.phase] || payload.phase}`);
        if (!paymentRequired || payload.phase !== "created") {
          showScreen(screenForPhase(payload.phase));
        }
        if (["deliberation", "reveal", "report", "done"].includes(payload.phase)) {
          hide(introBox);
          hide(answerBox);
        }
        if (payload.phase === "done") finish(false);
        break;
      case "loading.progress":
        log(payload.msg || "");
        break;
      case "loading.done":
        log(`仓库读取完成：${payload.files_read} 个文件 / ${payload.chars} 字符`, "green");
        if (payload.prd_provided) log("PRD 已纳入评审", "green");
        if (payload.demo_provided) log("成品网址已纳入评审", "green");
        break;
      case "judge.thinking":
        ensureCard(payload.judge_id);
        log(`评委 ${payload.judge_id} 正在阅读证据包…`);
        break;
      case "judge.ready":
        markReady(payload.judge_id, payload.name);
        log(`评委「${payload.name}」已就位`, "green");
        break;
      case "intro.requested":
        log("请做自我介绍（30 秒内）", "gold");
        resetInputs();
        $("#intro-text").value = "";
        show(introBox);
        $("#intro-text").focus();
        break;
      case "intro.done":
        hide(introBox);
        log(`自我介绍已记录：${(payload.text || "").slice(0, 40)}`);
        break;
      case "qa.start":
        log(`答辩开始，共 ${payload.total} 问`, "gold");
        hide(introBox);
        break;
      case "qa.question":
        log(`第 ${payload.index} 问 · ${payload.name}：${payload.text}`, "gold");
        resetInputs();
        $("#q-index").textContent = `#${payload.index}`;
        $("#q-text").textContent = payload.text || "";
        $("#answer-text").value = "";
        show(answerBox);
        $("#answer-text").focus();
        break;
      case "qa.answer":
        hide(answerBox);
        log("回答已记录", "green");
        break;
      case "qa.reaction":
        log(`「${payload.name}」：${payload.text}`);
        break;
      case "qa.end":
        hide(answerBox);
        log("答辩结束");
        break;
      case "deliberation.start":
        log("评委开始合议…", "gold");
        break;
      case "encore":
        log(`🎤 安可：${payload.name} 返场`, "gold");
        break;
      case "bicker.line":
        log(`🔥 ${payload.name}：${payload.text}`, "hot");
        break;
      case "reveal.chair":
        renderReveal(payload);
        if (payload.turned === null) {
          log(`🪑 ${payload.name}：缺席（缺评）`, "red");
        } else {
          log(`🪑 ${payload.name}：${payload.turned ? "✅ 转身" : "❌ 留座"} ${payload.final_score ?? 0}/${payload.weight}`, payload.turned ? "green" : "red");
        }
        break;
      case "report.ready":
        log(`报告已生成（${payload.chars} 字）`, "green");
        renderReport(payload);
        break;
      case "error":
        log(`[${payload.stage}] ${payload.msg}`, "red");
        if (!payload.degraded) finish(true);
        break;
      default:
        log(`${type} ${JSON.stringify(payload)}`);
    }
  }

  function connect(id) {
    if (source) source.close();
    lastEventId = -1;
    source = new EventSource(`/api/sessions/${id}/events`);
    source.onmessage = (msg) => {
      const idNum = Number(msg.lastEventId);
      if (Number.isFinite(idNum)) {
        if (idNum <= lastEventId) return;
        lastEventId = idNum;
      }
      try {
        handle(JSON.parse(msg.data));
      } catch (err) {
        console.error(err, msg.data);
      }
    };
    source.onerror = () => {
      if (!finished) log("SSE 连接中断，浏览器会自动重连…", "red");
    };
  }

  async function restore(id) {
    sessionId = id;
    try {
      const resp = await fetch(`/api/sessions/${id}`);
      if (!resp.ok) throw new Error("会话不存在");
      const snap = await resp.json();
      showScreen(screenForPhase(snap.phase));
      setPhase(snap.phase);
      if (snap.paid_status === "unpaid") {
        showScreen("submit");
        show(payBox);
        $("#pay-hint").textContent = "扫码支付后点「我已支付」。";
      } else if (snap.paid_status === "pending") {
        showScreen("submit");
        show(payBox);
        $("#pay-hint").textContent = "已通知老板，等待放行…";
        $("#paid-btn").disabled = true;
      }
      if (snap.phase === "report" || snap.phase === "done") {
        renderReport({
          totals: snap.totals || {},
          owner_comment: snap.owner_comment || "",
        });
      }
      connect(id);
    } catch (err) {
      log(String(err.message || err), "red");
      history.replaceState(null, "", location.pathname);
      showScreen("submit");
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const repo = repoInput.value.trim();
    if (!repo) return;

    startBtn.disabled = true;
    finished = false;
    cards.clear();
    judgesEl.replaceChildren();
    logEl.replaceChildren();
    hide(payBox);
    hide(introBox);
    hide(answerBox);
    summaryEl.textContent = "";
    dot.className = "dot live";
    phaseEl.textContent = "正在创建会话…";

    try {
      const data = await post("/api/sessions", {
        repo_url: repo,
        prd: $("#prd").value.trim() || null,
        demo_url: $("#demo").value.trim() || null,
      });
      sessionId = data.session_id;
      paymentRequired = Boolean(data.payment_required);
      history.replaceState(null, "", `?s=${sessionId}`);
      if (paymentRequired) {
        setPhase("created");
        showScreen("submit");
        show(payBox);
        $("#pay-hint").textContent = "扫码支付后点「我已支付」，老板放行后自动开跑。";
        $("#paid-btn").disabled = false;
      } else {
        showScreen("stage");
      }
      connect(sessionId);
    } catch (err) {
      startBtn.disabled = false;
      log(String(err.message || err), "red");
      finish(true);
    }
  });

  async function submitOnce(button, hint, path, body, doneText) {
    button.disabled = true;
    hint.textContent = "已提交，等待评委…";
    try {
      await post(path, body);
      hint.textContent = doneText;
    } catch (err) {
      button.disabled = false;
      hint.textContent = String(err.message || err);
    }
  }

  $("#intro-submit").addEventListener("click", () => {
    const text = $("#intro-text").value.trim();
    submitOnce($("#intro-submit"), $("#intro-hint"), `/api/sessions/${sessionId}/intro`, { text }, "已记录");
  });

  $("#answer-submit").addEventListener("click", () => {
    const text = $("#answer-text").value.trim();
    submitOnce($("#answer-submit"), $("#answer-hint"), `/api/sessions/${sessionId}/answer`, { text }, "已记录");
  });

  async function skip() {
    try {
      await post(`/api/sessions/${sessionId}/skip`, {});
      hide(introBox);
      hide(answerBox);
      log("已选择直接宣判", "gold");
    } catch (err) {
      log(String(err.message || err), "red");
    }
  }

  $("#intro-skip").addEventListener("click", skip);
  $("#answer-skip").addEventListener("click", skip);

  $("#paid-btn").addEventListener("click", async () => {
    $("#paid-btn").disabled = true;
    try {
      await post(`/api/sessions/${sessionId}/paid`, {});
      $("#pay-hint").textContent = "已通知老板，等待放行…";
    } catch (err) {
      $("#paid-btn").disabled = false;
      $("#pay-hint").textContent = String(err.message || err);
    }
  });

  $("#restart").addEventListener("click", () => {
    history.replaceState(null, "", location.pathname);
    location.reload();
  });

  // 刷新恢复：URL 上带 ?s=session_id
  const params = new URLSearchParams(location.search);
  const existing = params.get("s");
  if (existing) {
    hide($("#screen-submit"));
    showScreen("stage");
    restore(existing);
  }
})();
</script>
</body>
</html>
